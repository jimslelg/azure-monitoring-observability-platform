# Scrape settings for the Azure Monitor managed Prometheus add-on.
# Apply to each AKS cluster: kubectl apply -f ama-metrics-settings-configmap.yaml
# The add-on watches this exact name/namespace and hot-reloads on change.
kind: ConfigMap
apiVersion: v1
metadata:
  name: ama-metrics-settings-configmap
  namespace: kube-system
data:
  schema-version: v1
  config-version: ver1
  prometheus-collector-settings: |-
    cluster_alias = ""
  default-scrape-settings-enabled: |-
    kubelet = true
    coredns = true
    cadvisor = true
    kubeproxy = false
    apiserver = false
    kubestate = true
    nodeexporter = true
    windowsexporter = false
    windowskubeproxy = false
    kappiebasic = false
    prometheuscollectorhealth = true
  # Keep additional labels/series only where dashboards use them; every extra
  # series is billed ingestion.
  default-targets-metrics-keep-list: |-
    kubelet = ""
    coredns = ""
    cadvisor = ""
    kubestate = ""
    nodeexporter = ""
  default-targets-scrape-interval-settings: |-
    kubelet = "30s"
    coredns = "30s"
    cadvisor = "30s"
    kubestate = "30s"
    nodeexporter = "30s"
  debug-mode: |-
    enabled = false
