# Applies the reviewed plan artifact. Human approval is configured on the
# Azure DevOps Environment this deployment job targets — never in YAML — so
# changing this file can't bypass the gate.
parameters:
  - name: environment
    type: string
  - name: serviceConnection
    type: string
  - name: adoEnvironment
    type: string

jobs:
  - deployment: apply_${{ parameters.environment }}
    displayName: 'terraform apply (${{ parameters.environment }})'
    environment: ${{ parameters.adoEnvironment }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - download: current
              artifact: 'tfplan-${{ parameters.environment }}'
              displayName: 'Download plan artifact'

            - task: AzureCLI@2
              displayName: 'terraform apply saved plan'
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                addSpnToEnvironment: true
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  export ARM_USE_OIDC=true
                  export ARM_CLIENT_ID="$servicePrincipalId"
                  export ARM_OIDC_TOKEN="$idToken"
                  export ARM_TENANT_ID="$tenantId"
                  export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                  terraform -chdir=terraform init -input=false \
                    -backend-config=environments/${{ parameters.environment }}.backend.hcl
                  terraform -chdir=terraform apply -input=false \
                    "$(Pipeline.Workspace)/tfplan-${{ parameters.environment }}/${{ parameters.environment }}.tfplan"
